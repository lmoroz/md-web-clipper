<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="popup.css">
</head>
<body>
	<div id="app">
		<input id="filename" type="text" title="Имя файла" spellcheck="false">
		<textarea id="preview" spellcheck="false" placeholder="Извлекаю страницу…"></textarea>
		<label id="imgRow"><input id="images" type="checkbox" checked> Скачивать картинки (в подпапку «…_files»)</label>
		<label id="vidRow" hidden><input id="videos" type="checkbox" checked> Скачивать видео <span id="vidInfo"></span></label>
		<button id="saveHere" hidden disabled>Save to «<span id="dirName"></span>»</button>
		<div id="buttons">
			<button id="save" disabled>Save to folder…</button>
			<button id="copy" disabled>Copy to clipboard</button>
		</div>
		<div id="status"></div>
	</div>
	<script src="popup.js"></script>
</body>
</html>
