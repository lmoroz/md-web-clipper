<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="popup.css">
</head>
<body>
	<div id="app">
		<input id="filename" type="text" title="Имя файла" spellcheck="false">
		<textarea id="preview" spellcheck="false" placeholder="Извлекаю страницу…"></textarea>
		<label id="imgRow"><input id="images" type="checkbox" checked> Скачивать картинки (в подпапку «…_files»)</label>
		<label id="vidRow" hidden><input id="videos" type="checkbox" checked> Скачивать видео <span id="vidInfo"></span></label>
		<button id="saveHere" hidden disabled>Save to «<span id="dirName"></span>»</button>
		<div id="buttons">
			<button id="save" disabled>Save to folder…</button>
			<button id="copy" disabled>Copy to clipboard</button>
		</div>
		<div id="status"></div>
		<div id="update" hidden>
			<a id="updLink" target="_blank" rel="noopener"></a>
			<span id="updInfo" tabindex="0" aria-describedby="updTip">
				<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.6" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
				<div id="updTip" role="tooltip"></div>
			</span>
		</div>
	</div>
	<script src="popup.js"></script>
</body>
</html>
